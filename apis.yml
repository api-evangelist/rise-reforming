name: Rise Reforming
description: Rise Reforming is a climate-technology company that converts underutilized
  and flared waste biogas into valuable chemicals such as dimethyl ether (DME) and
  methanol. It deploys a modular, on-site reforming process at biogas sources like
  wastewater treatment plants, enabling localized, supply-secure chemical production
  and reducing dependence on centralized, fossil-fuel-based chemical manufacturing.
  A Y Combinator (Summer 2026) company, it is building the first wastewater biogas-to-methanol
  demonstration in the Americas at a Chicagoland wastewater facility. As a hardware
  and chemical-process company, it currently publishes no public web API, developer
  portal, or software SDK surface.
